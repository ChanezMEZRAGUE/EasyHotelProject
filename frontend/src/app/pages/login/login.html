<section class="auth-page">
  <div class="auth-card">
    <header class="auth-header">
      <h1>{{ 'login.title' | tr }}</h1>
      <p>{{ 'login.subtitle' | tr }}</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.email' | tr }}</mat-label>
        <input matInput type="email" formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.password' | tr }}</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>

      <p *ngIf="errorMessage" class="auth-error">{{ errorMessage }}</p>

      <button mat-flat-button color="primary" type="submit" class="primary-action" [disabled]="loading">
        {{ 'login.button' | tr }}
      </button>

      <div class="auth-footer">
        <span>{{ 'login.noAccount' | tr }}</span>
        <a routerLink="/register" [queryParams]="returnUrl ? { returnUrl: returnUrl } : null">{{ 'login.create' | tr }}</a>
      </div>
    </form>
  </div>
</section>
