<section class="auth-page">
  <div class="auth-card">
    <header class="auth-header">
      <h1>{{ 'register.title' | tr }}</h1>
      <p>{{ 'register.subtitle' | tr }}</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="field-grid">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'register.firstName' | tr }}</mat-label>
          <input matInput type="text" formControlName="firstName">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'register.lastName' | tr }}</mat-label>
          <input matInput type="text" formControlName="lastName">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'register.email' | tr }}</mat-label>
        <input matInput type="email" formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'register.phone' | tr }}</mat-label>
        <input matInput type="text" formControlName="phone">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'register.password' | tr }}</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>

      <p *ngIf="errorMessage" class="auth-error">{{ errorMessage }}</p>

      <button mat-flat-button color="primary" type="submit" class="primary-action" [disabled]="loading">
        {{ 'register.button' | tr }}
      </button>

      <div class="auth-footer">
        <span>{{ 'register.already' | tr }}</span>
        <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl: returnUrl } : null">{{ 'register.login' | tr }}</a>
      </div>
    </form>
  </div>
</section>
